<svg width="360" height="88" viewBox="0 0 360 88" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bison Concrete">
  <!-- Emblem -->
  <rect x="2" y="2" width="84" height="84" rx="18" fill="#C0202E"/>
  <rect x="2" y="2" width="84" height="84" rx="18" fill="url(#g)" fill-opacity="0.25"/>
  <!-- Bison head silhouette -->
  <g fill="#ffffff">
    <!-- crown / shaggy top -->
    <path d="M44 20c-9 0-16 4-19 11-6-3-11-2-14 2-3 5-1 11 4 14-1 3-1 6 0 9 2 5 7 8 12 8h34c5 0 10-3 12-8 1-3 1-6 0-9 5-3 7-9 4-14-3-4-8-5-14-2-3-7-10-11-19-11z"/>
  </g>
  <!-- horns -->
  <g fill="#F2C14E">
    <path d="M25 33c-5-2-9-1-11 2-2 3-1 7 2 9 1-4 4-7 9-8 1-1 1-2 0-3z"/>
    <path d="M63 33c5-2 9-1 11 2 2 3 1 7-2 9-1-4-4-7-9-8-1-1-1-2 0-3z"/>
  </g>
  <!-- face detail: eyes + snout in red knockout -->
  <g fill="#C0202E">
    <circle cx="36" cy="44" r="3.2"/>
    <circle cx="52" cy="44" r="3.2"/>
    <path d="M40 56c0-2 2-3 4-3s4 1 4 3-2 4-4 4-4-2-4-4z"/>
  </g>
  <!-- Wordmark -->
  <text x="102" y="46" font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="30" letter-spacing="0.5" fill="#16181C">BISON</text>
  <text x="102" y="72" font-family="Archivo, Arial, sans-serif" font-weight="600" font-size="16.5" letter-spacing="6" fill="#C0202E">CONCRETE</text>
  <defs>
    <linearGradient id="g" x1="2" y1="2" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
</svg>
